<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#6366f1"
  >

  <meta
    name="description"
    content="Revision Rules - HSC Smart Revision Tracker"
  >

  <title>Revision Rules</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(
          circle at top left,
          #eef2ff 0%,
          #f8f9ff 35%,
          #ffffff 100%
        );
      color: #172033;
      padding-bottom: 90px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    /* =====================================================
       COMMON
    ===================================================== */

    .page {
      display: none;
      width: 100%;
    }

    .page.active {
      display: block;
    }

    .container {
      width: min(100% - 28px, 1000px);
      margin: 0 auto;
    }

    .section-title {
      font-family: "DM Serif Display", serif;
      font-size: 27px;
      margin-bottom: 16px;
      color: #172033;
    }

    .muted {
      color: #7b8497;
    }

    .empty-state {
      padding: 35px 20px;
      text-align: center;
      color: #7b8497;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #e7eaf3;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .top-header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid #e9ebf2;
      padding: 24px 0 20px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand-title {
      font-family: "DM Serif Display", serif;
      font-size: 32px;
      line-height: 1.1;
      color: #172033;
    }

    .brand-subtitle {
      margin-top: 7px;
      color: #7b8497;
      font-size: 14px;
    }

    .streak-pill {
      min-width: 70px;
      padding: 11px 14px;
      border-radius: 18px;
      background: #fff6df;
      color: #d78b00;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 8px 25px rgba(215, 139, 0, 0.08);
    }

    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      margin-top: 24px;
      border-radius: 30px;
      padding: 30px 26px;
      color: white;
      background:
        linear-gradient(
          135deg,
          #6366f1 0%,
          #7161e8 50%,
          #8b5cf6 100%
        );
      box-shadow:
        0 20px 50px rgba(99, 102, 241, 0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .hero-small {
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 800;
      opacity: 0.9;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-family: "DM Serif Display", serif;
      font-size: 38px;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .hero p {
      font-size: 15px;
      line-height: 1.7;
      opacity: 0.9;
      max-width: 550px;
    }

    .hero-progress {
      width: 120px;
      height: 120px;
      min-width: 120px;
      border-radius: 50%;
      border: 8px solid rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
    }

    /* =====================================================
       SUBJECT HEADER
    ===================================================== */

    .subjects-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
      margin-bottom: 15px;
    }

    .subjects-heading .section-title {
      margin-bottom: 0;
    }

    #todayCount {
      color: #7b8497;
      font-size: 14px;
    }

    /* =====================================================
       SUBJECT CARDS
    ===================================================== */

    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .subject-card {
      background: white;
      border: 1px solid #e7eaf3;
      border-radius: 23px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.05);
      transition: 0.2s ease;
    }

    .subject-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(23, 32, 51, 0.09);
    }

    .subject-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .subject-name {
      font-weight: 800;
      font-size: 17px;
    }

    .subject-icon {
      font-size: 26px;
    }

    .subject-percent
